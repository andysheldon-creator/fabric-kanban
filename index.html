<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 Fabric Platform Kanban</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: #000;
            color: #fff;
            padding: 30px;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        
        /* Animated background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(220, 38, 38, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(239, 68, 68, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(185, 28, 28, 0.15) 0%, transparent 50%);
            animation: bgMove 20s ease infinite;
            z-index: -1;
        }
        
        @keyframes bgMove {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(50px, 30px); }
        }
        
        .header {
            background: linear-gradient(135deg, #dc2626 0%, #b91c1c 50%, #991b1b 100%);
            padding: 50px;
            border-radius: 24px;
            margin-bottom: 40px;
            box-shadow: 
                0 20px 60px rgba(220, 38, 38, 0.5),
                inset 0 1px 0 rgba(255,255,255,0.2);
            position: relative;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.1);
        }
        
        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
            animation: headerPulse 4s ease-in-out infinite;
        }
        
        @keyframes headerPulse {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-30px, -30px) scale(1.1); }
        }
        
        .header h1 { 
            font-size: 48px; 
            margin-bottom: 12px;
            position: relative;
            z-index: 1;
            font-weight: 700;
            text-shadow: 0 4px 12px rgba(0,0,0,0.3);
            letter-spacing: -1px;
        }
        
        .header .subtitle { 
            font-size: 18px;
            position: relative;
            z-index: 1;
            opacity: 0.95;
            font-weight: 400;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d1818 100%);
            padding: 32px;
            border-radius: 20px;
            border: 2px solid #dc262620;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #dc2626, #ef4444, #dc2626);
            background-size: 200% 100%;
            animation: shimmer 2s linear infinite;
        }
        
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        
        .stat-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 40px rgba(220, 38, 38, 0.4);
            border-color: #dc2626;
        }
        
        .stat-card .label {
            font-size: 13px;
            text-transform: uppercase;
            opacity: 0.6;
            margin-bottom: 12px;
            letter-spacing: 2px;
            font-weight: 600;
        }
        
        .stat-card .value {
            font-size: 48px;
            font-weight: 700;
            background: linear-gradient(135deg, #dc2626, #ef4444, #f87171);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }
        
        .controls {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d1818 100%);
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 30px;
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            align-items: center;
            border: 2px solid #dc262620;
        }
        
        .filter-group {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        
        .filter-group label {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            color: #999;
        }
        
        select {
            background: #0a0a0a;
            color: #fff;
            border: 2px solid #333;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
        }
        
        select:hover, select:focus {
            border-color: #dc2626;
            outline: none;
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1);
        }
        
        .reset-btn {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-left: auto;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
        }
        
        .reset-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(220, 38, 38, 0.5);
        }
        
        .reset-btn:active {
            transform: translateY(-1px);
        }
        
        .progress-wrapper {
            margin-bottom: 40px;
        }
        
        .progress-label {
            font-size: 14px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            font-weight: 600;
        }
        
        .progress-percent {
            color: #dc2626;
            font-size: 18px;
        }
        
        .progress-bar {
            background: #1a1a1a;
            height: 12px;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid #dc262620;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.5);
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #dc2626, #ef4444, #f87171);
            background-size: 200% 100%;
            animation: progressShimmer 2s linear infinite;
            box-shadow: 0 0 20px rgba(220, 38, 38, 0.8);
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        @keyframes progressShimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        
        .board {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 28px;
        }
        
        .column {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d1818 100%);
            border-radius: 20px;
            padding: 24px;
            border: 2px solid #dc262620;
            min-height: 500px;
            transition: all 0.3s;
        }
        
        .column.drag-over {
            box-shadow: 0 0 0 3px #dc2626, 0 10px 40px rgba(220, 38, 38, 0.4);
            background: linear-gradient(135deg, #2a1a1a 0%, #3d1818 100%);
            transform: scale(1.02);
        }
        
        .column-header {
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 3px solid #dc2626;
            display: flex;
            justify-content: space-between;
            align-items: center;
            letter-spacing: 2px;
        }
        
        .column-count {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            color: white;
            font-size: 13px;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(220, 38, 38, 0.4);
        }
        
        .cards-container {
            min-height: 300px;
        }
        
        .card {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0a0a 100%);
            border: 2px solid #333;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            cursor: grab;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 6px;
            height: 100%;
            background: linear-gradient(180deg, #dc2626, #b91c1c);
        }
        
        .card:hover {
            border-color: #dc2626;
            transform: translateY(-6px) scale(1.03);
            box-shadow: 0 12px 32px rgba(220, 38, 38, 0.4);
        }
        
        .card.dragging {
            opacity: 0.6;
            cursor: grabbing;
            transform: rotate(5deg) scale(1.05);
            box-shadow: 0 20px 50px rgba(220, 38, 38, 0.6);
        }
        
        .card-id {
            font-size: 13px;
            color: #dc2626;
            font-weight: 700;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .card-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #fff;
            line-height: 1.4;
        }
        
        .card-desc {
            font-size: 14px;
            opacity: 0.7;
            margin-bottom: 16px;
            line-height: 1.6;
        }
        
        .card-meta {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .badge {
            font-size: 11px;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .badge.critical { 
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            color: white;
            box-shadow: 0 3px 10px rgba(220, 38, 38, 0.5);
            animation: badgePulse 2s ease-in-out infinite;
        }
        
        @keyframes badgePulse {
            0%, 100% { box-shadow: 0 3px 10px rgba(220, 38, 38, 0.5); }
            50% { box-shadow: 0 5px 20px rgba(220, 38, 38, 0.8); }
        }
        
        .badge.high { 
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: white;
            box-shadow: 0 3px 10px rgba(249, 115, 22, 0.5);
        }
        
        .badge.medium { 
            background: linear-gradient(135deg, #eab308, #ca8a04);
            color: #000;
            box-shadow: 0 3px 10px rgba(234, 179, 8, 0.5);
        }
        
        .badge.low { 
            background: linear-gradient(135deg, #6b7280, #4b5563);
            color: white;
            box-shadow: 0 3px 10px rgba(107, 114, 128, 0.5);
        }
        
        .estimate {
            font-size: 14px;
            color: #dc2626;
            margin-left: auto;
            font-weight: 700;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            opacity: 0.3;
            font-size: 14px;
            font-style: italic;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .card {
            animation: slideIn 0.4s ease-out;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎯 Fabric Academy Platform</h1>
        <div class="subtitle">Interactive Kanban Board | Drag & Drop Features</div>
    </div>

    <div class="stats">
        <div class="stat-card">
            <div class="label">Total Features</div>
            <div class="value" id="total-features">25</div>
        </div>
        <div class="stat-card">
            <div class="label">Estimated Hours</div>
            <div class="value" id="total-hours">676</div>
        </div>
        <div class="stat-card">
            <div class="label">Completed</div>
            <div class="value" id="completed-count">0</div>
        </div>
        <div class="stat-card">
            <div class="label">In Progress</div>
            <div class="value" id="progress-count">0</div>
        </div>
    </div>

    <div class="progress-wrapper">
        <div class="progress-label">
            <span>OVERALL PROGRESS</span>
            <span class="progress-percent" id="progress-percent">0%</span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
        </div>
    </div>

    <div class="controls">
        <div class="filter-group">
            <label>Priority:</label>
            <select id="filter-priority" onchange="renderBoard()">
                <option value="">All</option>
                <option value="critical">Critical</option>
                <option value="high">High</option>
                <option value="medium">Medium</option>
                <option value="low">Low</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Category:</label>
            <select id="filter-category" onchange="renderBoard()">
                <option value="">All</option>
                <option value="core">Core</option>
                <option value="coaching">Coaching</option>
                <option value="learning">Learning</option>
                <option value="content">Content</option>
                <option value="analytics">Analytics</option>
            </select>
        </div>
        <button class="reset-btn" onclick="resetBoard()">↻ Reset Board</button>
    </div>

    <div class="board" id="kanban-board"></div>

    <script>
const initialData = {"project":"fabric-platform","name":"Fabric Academy Platform","description":"Marketing coaching and training platform with personalized learning journeys","created":"2026-02-01","columns":["backlog","todo","in-progress","review","done"],"features":[{"id":"F001","title":"User Authentication & Registration","description":"Multi-role auth system (learner, coach, admin, company admin)","priority":"critical","status":"backlog","category":"core","estimate_hours":24,"tags":["auth","backend","security"]},{"id":"F002","title":"Skills & Behavioral Assessment Tool","description":"Interactive assessment to identify strengths, gaps, and growth opportunities across skills and mindset","priority":"high","status":"backlog","category":"assessment","estimate_hours":40,"tags":["assessment","frontend","data-capture"]},{"id":"F003","title":"Personalized Learning Pathway Builder","description":"Algorithm to generate customized development journeys based on assessment results","priority":"high","status":"backlog","category":"learning","estimate_hours":48,"tags":["ai","recommendation-engine","backend"]},{"id":"F004","title":"1-1 Coaching Booking System","description":"Calendar integration, coach matching, session scheduling, video conferencing links","priority":"high","status":"backlog","category":"coaching","estimate_hours":32,"tags":["calendar","scheduling","integration"]},{"id":"F005","title":"Group Coaching Session Management","description":"Create and manage group coaching sessions, attendee tracking, recordings","priority":"medium","status":"backlog","category":"coaching","estimate_hours":28,"tags":["group-sessions","video","backend"]},{"id":"F006","title":"On-Demand Learning Library","description":"Video library, course catalog, content categorization, search and filter","priority":"high","status":"backlog","category":"content","estimate_hours":36,"tags":["video","cms","search"]},{"id":"F007","title":"Coach Profile & Matching System","description":"Coach profiles (CMOs, Heads of Brand, etc.), expertise tags, automated matching based on learner needs","priority":"high","status":"backlog","category":"coaching","estimate_hours":24,"tags":["profiles","matching-algorithm","backend"]},{"id":"F008","title":"Progress Tracking Dashboard (Learner)","description":"Real-time progress across skills, confidence, behavior. Visual progress indicators","priority":"high","status":"backlog","category":"analytics","estimate_hours":32,"tags":["dashboard","charts","frontend"]},{"id":"F009","title":"Admin Reporting & Insights Dashboard","description":"Quarterly L&D insights, impact reports, team performance metrics for company admins","priority":"medium","status":"backlog","category":"analytics","estimate_hours":40,"tags":["reporting","analytics","export"]},{"id":"F010","title":"Live Programme/Workshop Management","description":"Schedule live training programmes, registration, attendance tracking, post-session materials","priority":"medium","status":"backlog","category":"learning","estimate_hours":28,"tags":["events","workshops","backend"]},{"id":"F011","title":"Notification & Reminder System","description":"Email/SMS reminders for sessions, new content alerts, progress milestones","priority":"medium","status":"backlog","category":"engagement","estimate_hours":16,"tags":["notifications","email","engagement"]},{"id":"F012","title":"Content Delivery & Streaming","description":"Video hosting, adaptive streaming, transcript generation, playback tracking","priority":"high","status":"backlog","category":"content","estimate_hours":32,"tags":["video","cdn","streaming"]},{"id":"F013","title":"Session Notes & Action Items","description":"Coaches and learners can add notes, action items, goals after sessions","priority":"medium","status":"backlog","category":"coaching","estimate_hours":20,"tags":["notes","collaboration","frontend"]},{"id":"F014","title":"Feedback & Rating System","description":"Learners rate sessions, provide feedback on coaches and content quality","priority":"low","status":"backlog","category":"quality","estimate_hours":16,"tags":["feedback","ratings","ux"]},{"id":"F015","title":"Payment & Subscription Management","description":"Stripe integration, tiered pricing, company billing, invoice generation","priority":"high","status":"backlog","category":"monetization","estimate_hours":32,"tags":["payments","stripe","billing"]},{"id":"F016","title":"Mobile Responsive Design","description":"Fully responsive UI for learners on-the-go","priority":"high","status":"backlog","category":"ux","estimate_hours":40,"tags":["responsive","mobile","frontend"]},{"id":"F017","title":"Marketing Landing Pages","description":"Public-facing pages: homepage, demo booking, pricing, coach profiles, testimonials","priority":"medium","status":"backlog","category":"marketing","estimate_hours":24,"tags":["landing-pages","seo","frontend"]},{"id":"F018","title":"Demo Booking Flow","description":"Calendly-style demo scheduling for prospective clients","priority":"medium","status":"backlog","category":"sales","estimate_hours":12,"tags":["scheduling","sales","integration"]},{"id":"F019","title":"Team Management (Company Admin)","description":"Add/remove learners, assign coaches, view team progress, manage licenses","priority":"medium","status":"backlog","category":"admin","estimate_hours":28,"tags":["team-management","admin","backend"]},{"id":"F020","title":"Coach Availability Calendar","description":"Coaches set their availability, blocked times, recurring schedules","priority":"medium","status":"backlog","category":"coaching","estimate_hours":20,"tags":["calendar","scheduling","backend"]},{"id":"F021","title":"Email Campaign Integration","description":"Newsletter signup, drip campaigns for engagement, HubSpot integration","priority":"low","status":"backlog","category":"marketing","estimate_hours":16,"tags":["email","marketing-automation","integration"]},{"id":"F022","title":"Resource Library (PDFs, Templates)","description":"Downloadable resources, templates, worksheets for learners","priority":"low","status":"backlog","category":"content","estimate_hours":12,"tags":["resources","downloads","cms"]},{"id":"F023","title":"Automated Progress Reports","description":"Auto-generate quarterly reports, send to company admins, export as PDF","priority":"medium","status":"backlog","category":"analytics","estimate_hours":24,"tags":["automation","reporting","pdf"]},{"id":"F024","title":"API for Third-Party Integrations","description":"RESTful API for integrations with HRIS, LMS, CRM systems","priority":"low","status":"backlog","category":"integration","estimate_hours":32,"tags":["api","integration","backend"]},{"id":"F025","title":"Search & Discovery","description":"Global search across content, coaches, resources with smart filters","priority":"medium","status":"backlog","category":"ux","estimate_hours":20,"tags":["search","elasticsearch","frontend"]}]};

let kanbanData = loadData();

function loadData() {
    const saved = localStorage.getItem('fabric-kanban-data');
    return saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(initialData));
}

function saveData() {
    localStorage.setItem('fabric-kanban-data', JSON.stringify(kanbanData));
}

function resetBoard() {
    if (confirm('Reset board to initial state? This will clear all your changes.')) {
        kanbanData = JSON.parse(JSON.stringify(initialData));
        saveData();
        renderBoard();
    }
}

function updateStats() {
    const done = kanbanData.features.filter(f => f.status === 'done').length;
    const inProgress = kanbanData.features.filter(f => f.status === 'in-progress').length;
    const progress = (done / kanbanData.features.length * 100).toFixed(0);
    
    document.getElementById('completed-count').textContent = done;
    document.getElementById('progress-count').textContent = inProgress;
    document.getElementById('progress-percent').textContent = progress + '%';
    document.getElementById('progress-fill').style.width = progress + '%';
}

function renderBoard() {
    const priorityFilter = document.getElementById('filter-priority').value;
    const categoryFilter = document.getElementById('filter-category').value;
    const board = document.getElementById('kanban-board');
    board.innerHTML = '';

    const columns = kanbanData.columns;
    
    columns.forEach(columnName => {
        const columnFeatures = kanbanData.features.filter(f => {
            let match = f.status === columnName;
            if (priorityFilter) match = match && f.priority === priorityFilter;
            if (categoryFilter) match = match && f.category === categoryFilter;
            return match;
        });

        const columnDiv = document.createElement('div');
        columnDiv.className = 'column';
        columnDiv.dataset.column = columnName;
        
        columnDiv.innerHTML = `
            <div class="column-header">
                <span>${columnName.replace('-', ' ').toUpperCase()}</span>
                <span class="column-count">${columnFeatures.length}</span>
            </div>
            <div class="cards-container"></div>
        `;

        const container = columnDiv.querySelector('.cards-container');

        if (columnFeatures.length === 0) {
            container.innerHTML = '<div class="empty-state">Drop features here</div>';
        }

        columnFeatures.forEach(feature => {
            const card = document.createElement('div');
            card.className = 'card';
            card.draggable = true;
            card.dataset.featureId = feature.id;
            
            card.innerHTML = `
                <div class="card-id">${feature.id}</div>
                <div class="card-title">${feature.title}</div>
                <div class="card-desc">${feature.description}</div>
                <div class="card-meta">
                    <span class="badge ${feature.priority}">${feature.priority}</span>
                    <span class="estimate">${feature.estimate_hours}h</span>
                </div>
            `;

            card.addEventListener('dragstart', handleDragStart);
            card.addEventListener('dragend', handleDragEnd);

            container.appendChild(card);
        });

        columnDiv.addEventListener('dragover', handleDragOver);
        columnDiv.addEventListener('drop', handleDrop);
        columnDiv.addEventListener('dragleave', handleDragLeave);

        board.appendChild(columnDiv);
    });

    updateStats();
}

let draggedElement = null;

function handleDragStart(e) {
    draggedElement = this;
    this.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/html', this.innerHTML);
}

function handleDragEnd(e) {
    this.classList.remove('dragging');
}

function handleDragOver(e) {
    if (e.preventDefault) {
        e.preventDefault();
    }
    e.dataTransfer.dropEffect = 'move';
    
    const column = e.target.closest('.column');
    if (column) {
        column.classList.add('drag-over');
    }
    
    return false;
}

function handleDragLeave(e) {
    const column = e.target.closest('.column');
    if (column && !column.contains(e.relatedTarget)) {
        column.classList.remove('drag-over');
    }
}

function handleDrop(e) {
    if (e.stopPropagation) {
        e.stopPropagation();
    }
    
    const column = e.target.closest('.column');
    if (!column) return false;
    
    column.classList.remove('drag-over');
    
    const newStatus = column.dataset.column;
    const featureId = draggedElement.dataset.featureId;
    
    const feature = kanbanData.features.find(f => f.id === featureId);
    if (feature) {
        feature.status = newStatus;
        saveData();
        renderBoard();
    }
    
    return false;
}

renderBoard();
    </script>
</body>
</html>
